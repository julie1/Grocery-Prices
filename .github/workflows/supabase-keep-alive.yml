name: Keep Supabase Project Alive
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          curl -fsS -X POST "https://teudindahxbeiretiycf.supabase.co/rest/v1/keepalive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d '{"id": 1, "last_ping": "now()"}'
      - name: Ping Supabase Management API
        run: |
          curl -fsS --max-time 10 -X GET "https://api.supabase.io/v1/projects/teudindahxbeiretiycf" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json"
